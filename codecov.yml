coverage:
  status:
    # The package maintains full line coverage; any uncovered line fails CI.
    project:
      default:
        target: 100%
    # Lines changed/added by a PR must be fully covered as well.
    patch:
      default:
        target: 100%

# src/wip holds work-in-progress code not included in the module, so it can never be covered.
ignore:
  - "src/wip"
