coverage:
  status:
    # The package maintains full line coverage; any uncovered line fails CI.
    project:
      default:
        target: 100%
    # Lines changed/added by a PR must be fully covered as well.
    patch:
      default:
        target: 100%

# src/wip and src/sylvester.jl hold code not included in the module, so they can never be covered.
ignore:
  - "src/wip"
  - "src/sylvester.jl"
